<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Avva's Home Foods</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
    <style>
        /* ── Product Details Layout ── */
        .product-details-container {
            padding: 100px 0 60px;
        }

        .product-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px;
            margin: 36px 0 72px;
            align-items: center;
        }

        /* Image column */
        .pd-image-wrapper {
            position: relative;
            background: radial-gradient(ellipse at 55% 45%, rgba(200,150,46,0.1) 0%, transparent 68%);
            border: 1px solid rgba(200,150,46,0.14);
            border-radius: 28px;
            padding: 28px;
            text-align: center;
        }

        .pd-image {
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(200,150,46,0.08);
            margin: 0 auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .pd-image:hover {
            animation: pd-img-float 3.5s ease-in-out infinite;
        }

        /* Info column */
        .pd-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .pd-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 14px;
            color: var(--primary);
            line-height: 1.2;
        }

        .pd-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            font-size: 1.05rem;
        }

        .pd-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-family: var(--font-body);
        }

        .pd-description {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .pd-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        /* Reviews Section */
        .reviews-section {
            background: var(--bg-card);
            padding: 56px;
            border-radius: 28px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 60px;
        }

        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 22px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .review-item {
            background: var(--bg-elevated);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .reviewer-name {
            font-weight: 700;
            color: var(--primary);
        }

        .review-date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ── Entrance animations ── */

        /* Image wrapper slides in from left */
        .pd-image-wrapper {
            animation: pd-slide-left 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        /* Info panel slides in from right (no opacity — lets children reveal work) */
        .pd-info {
            animation: pd-slide-right 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
        }

        @keyframes pd-slide-left {
            from { opacity: 0; transform: translateX(-56px) scale(0.96); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes pd-slide-right {
            from { transform: translateX(52px); opacity: 0.4; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        @keyframes pd-img-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-14px) scale(1.015); }
        }

        /* Weight chips pop in with stagger */
        .weight-chip {
            opacity: 0;
            transform: translateY(8px) scale(0.88);
            animation: chip-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .weight-chip:nth-child(1) { animation-delay: 0.55s; }
        .weight-chip:nth-child(2) { animation-delay: 0.65s; }
        .weight-chip:nth-child(3) { animation-delay: 0.75s; }
        .weight-chip:nth-child(4) { animation-delay: 0.85s; }
        .weight-chip:nth-child(5) { animation-delay: 0.95s; }

        @keyframes chip-pop {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Reviews section fades up */
        .reviews-section {
            animation: fadeInUp 0.65s ease 0.4s both;
        }

        /* Review items stagger in */
        .review-item.rev-anim {
            opacity: 0;
            transform: translateY(22px);
            transition:
                opacity  0.45s ease calc(var(--ri, 0) * 0.09s),
                transform 0.45s ease calc(var(--ri, 0) * 0.09s);
        }
        .review-item.rev-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Sticky cart bar slides up */
        .sticky-cart-bar {
            animation: stickySlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;
        }
        @keyframes stickySlideUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* Accordion header hover */
        .accordion-header:hover { color: var(--primary); }

        /* Modal card scales in */
        .modal-overlay[style*="flex"] .modal-card {
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.82) translateY(24px); }
            to   { opacity: 1; transform: scale(1)    translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .product-details-grid {
                grid-template-columns: 1fr;
                gap: 36px;
            }
            .pd-image-wrapper { padding: 18px; }
        }
        @media (max-width: 768px) {
            .product-details-container { padding-top: 80px; padding-bottom: 80px; }
            .pd-title { font-size: 2rem; }
            .reviews-section { padding: 28px; }
            .pd-info { padding: 0 4px; }
        }
    </style>
</head>

<body>


    <!--Navigation (Same as other pages) -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="images/logo.png" alt="Avva's Home Foods Logo" class="nav-logo-img">
                <span class="logo-text">Avva's <span class="highlight">Home Foods</span></span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
            </ul>
            <div class="nav-actions">
                <div id="authActions">
                    <a href="signup.html" class="btn btn-primary btn-sm" id="loginBtn">Sign up</a>
                </div>
                <div id="userProfile" style="display: none;">
                    <span id="userName" style="margin-right: 10px; font-weight: 500;">User</span>
                    <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
                    <a href="admin.html" id="adminLink" class="btn btn-sm btn-primary" style="display:none; margin-left: 10px;">Dashboard</a>
                </div>
                <a href="javascript:void(0)" onclick="goToCart()" class="cart-btn" id="cartBtn">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="product-details-container" id="productContainer">
        <!-- Content loaded via JS -->
        <div class="loading-reviews">Loading product details...</div>
    </div>

    <!-- Sticky Bottom Cart Bar (Mobile Only) -->
    <div class="sticky-cart-bar mobile-only" id="stickyCartBar" style="display: none;">
        <div class="sticky-price-info">
            <span class="sticky-price" id="stickyPrice">₹0</span>
            <span class="sticky-weight" id="stickyWeight"></span>
        </div>
        <button class="btn btn-primary btn-full" id="stickyAddBtn" onclick="handleStickyAddToCart()">Add to
            Cart</button>
        <div class="qty-control" id="stickyQtyControl" style="display: none; width: 120px;">
            <button class="qty-btn-card" onclick="adjustStickyQty(-1)">-</button>
            <span class="qty-val-card" id="stickyQty">1</span>
            <button class="qty-btn-card" onclick="adjustStickyQty(1)">+</button>
        </div>
    </div>

    <!-- Review Form Modal -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Write a Review</h3>
                <button class="close-modal" onclick="closeReviewModal()">×</button>
            </div>
            <form id="reviewFormModal">
                <input type="hidden" id="modalProductId">
                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-rating" style="justify-content: center;">
                        <input type="radio" id="m-star5" name="rating" value="5" /><label for="m-star5">★</label>
                        <input type="radio" id="m-star4" name="rating" value="4" /><label for="m-star4">★</label>
                        <input type="radio" id="m-star3" name="rating" value="3" /><label for="m-star3">★</label>
                        <input type="radio" id="m-star2" name="rating" value="2" /><label for="m-star2">★</label>
                        <input type="radio" id="m-star1" name="rating" value="1" /><label for="m-star1">★</label>
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" id="modalReviewerName" class="form-input" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <textarea id="modalReviewComment" class="form-input" rows="3" placeholder="How was the product?"
                        required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Submit Review</button>
            </form>
        </div>
    </div>
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Avva's Home Foods. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/product-details.js"></script>
</body>

</html>
